<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- زليج مغربي خفيف: نجمة ثمانية في كل خلية -->
  <g fill="none" stroke-linejoin="round">
    <!-- النجمة الكبرى في الوسط -->
    <g stroke="#082d59" stroke-opacity="0.09" stroke-width="1.4">
      <rect x="35" y="35" width="50" height="50" />
      <rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)" />
      <circle cx="60" cy="60" r="11" />
    </g>
    <!-- زهرة ذهبية صغيرة في الوسط -->
    <g stroke="#d4a017" stroke-opacity="0.22" stroke-width="1.2">
      <rect x="54" y="54" width="12" height="12" transform="rotate(45 60 60)" />
    </g>
    <!-- خطوط الربط نحو الأطراف -->
    <g stroke="#082d59" stroke-opacity="0.07" stroke-width="1.2">
      <path d="M60 0V25M60 95V120M0 60H25M95 60H120" />
      <path d="M0 0L25 25M120 0L95 25M0 120L25 95M120 120L95 95" />
    </g>
    <!-- أرباع النجوم في الزوايا لتكتمل مع الخلايا المجاورة -->
    <g stroke="#0f6b3f" stroke-opacity="0.08" stroke-width="1.2">
      <path d="M0 14L14 0M106 0L120 14M0 106L14 120M106 120L120 106" />
      <circle cx="0" cy="0" r="8" />
      <circle cx="120" cy="0" r="8" />
      <circle cx="0" cy="120" r="8" />
      <circle cx="120" cy="120" r="8" />
    </g>
  </g>
</svg>
